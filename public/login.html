<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Moisture Alert</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=33">
    <style>
        body {
            background: var(--bg-app);
            display: flex;
            height: 100vh;
            margin: 0;
            font-family: var(--font-sans);
        }
        .login-layout {
            display: flex;
            width: 100%;
        }
        .login-image {
            flex: 1;
            background: url('/img/NEWBALANCE.jpeg') no-repeat center center;
            background-size: cover;
            position: relative;
        }
        .login-image::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(54,69,59,0.4) 0%, rgba(54,69,59,0.1) 100%);
        }
        .login-form-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-app);
            background-image: 
                linear-gradient(rgba(113, 142, 118, 0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(113, 142, 118, 0.07) 1px, transparent 1px);
            background-size: 30px 30px;
            padding: 2rem;
            z-index: 2;
            position: relative;
            overflow: hidden;
        }
        .login-form-container::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: var(--c-sage);
            border-radius: 50%;
            top: -100px;
            right: -100px;
            z-index: 0;
            filter: blur(80px);
            opacity: 0.8;
        }
        .login-form-container::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: var(--c-peach);
            border-radius: 50%;
            bottom: -50px;
            left: -50px;
            z-index: 0;
            filter: blur(80px);
            opacity: 0.8;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 3.5rem 3rem;
            border-radius: 1.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.04), inset 0 1px 0 rgba(255,255,255,0.6);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
            z-index: 1;
        }
        .login-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2rem;
        }
        .login-logo h2 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--c-olive);
            line-height: 1;
            margin: 0;
        }
        .login-logo span {
            font-family: 'Great Vibes', cursive;
            font-weight: 400;
            font-size: 3rem;
            color: var(--c-peach-text);
            margin-top: -0.5rem;
            margin-left: 2rem;
            display: block;
        }
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--c-text-main);
            margin-bottom: 0.5rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--c-border);
            border-radius: var(--radius-md);
            font-size: 0.9375rem;
            transition: all 0.2s;
            box-sizing: border-box;
            background: var(--bg-app);
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--c-olive);
            box-shadow: 0 0 0 3px rgba(54,69,59,0.1);
        }
        .btn-login {
            background: var(--c-olive);
            color: white;
            border: none;
            padding: 0.875rem;
            width: 100%;
            border-radius: var(--radius-pill);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
        }
        .btn-login:hover {
            background: var(--c-olive-light);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(54,69,59,0.2);
        }
        .guest-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--c-text-muted);
            font-size: 0.875rem;
            text-decoration: none;
            transition: color 0.2s;
        }
        .guest-link:hover {
            color: var(--c-olive);
        }
        .error-msg {
            color: var(--c-rose-text);
            font-size: 0.875rem;
            margin-top: 1rem;
            display: none;
        }
        @media (max-width: 768px) {
            .login-image {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="login-layout">
        <div class="login-image"></div>
        <div class="login-form-container">
            <div class="login-card">
                <div class="login-logo">
                    <h2>Moisture</h2>
                    <span>Alert</span>
                    <p style="color: var(--c-text-muted); font-size: 0.9375rem; margin-top: 1rem; margin-bottom: 0;">Welcome back! Please enter your details.</p>
                </div>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="username" placeholder="Yani" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    <div id="errorMsg" class="error-msg">Username atau Password salah!</div>
                    <button type="submit" class="btn-login">Login</button>
                </form>
                <a href="#" id="guestLogin" class="guest-link">Lanjutkan sebagai Umum (Guest) &rarr;</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            
            if (user.toLowerCase() === 'yani' && pass === 'Digital 123') {
                localStorage.setItem('currentUser', 'Yani');
                window.location.href = '/';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        });

        document.getElementById('guestLogin').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.setItem('currentUser', 'Guest');
            window.location.href = '/';
        });

        // If already logged in, redirect
        if (localStorage.getItem('currentUser')) {
            window.location.href = '/';
        }
    </script>
</body>
</html>
